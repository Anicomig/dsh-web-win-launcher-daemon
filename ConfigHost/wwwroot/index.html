<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH 配置</title>
<style>
/* color-scheme:dark 让 Chromium 的原生部件（表单控件、滚动条底色）走深色，
   标题栏的深色由宿主用 DwmSetWindowAttribute 单独处理。 */
:root{color-scheme:dark;--bg:#1f1f1f;--panel:#2b2b2b;--line:#3a3e45;--fg:#e8e8e8;--dim:#9a9a9a;
      --dim2:#6b7482;--ok:#4caf50;--warn:#ffb300;--err:#e53935;--accent:#4a9eff;
      --mono:Consolas,'Cascadia Mono',monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.6 "Segoe UI",system-ui,sans-serif;
     display:flex;flex-direction:column;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px;
       background:var(--panel);border-bottom:1px solid #3a3d42}
header h1{margin:0;font-size:15px;font-weight:600}
#status{margin-left:auto;font-size:12px;color:var(--dim)}
#status.dirty{color:var(--warn)} #status.ok{color:var(--ok)} #status.err{color:var(--err)}
nav{flex:none;display:flex;gap:6px;padding:8px 18px;background:#25272b;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{font-size:12px;padding:4px 12px;border-radius:13px;background:#2e3137;color:var(--dim);
      cursor:pointer;border:1px solid transparent;user-select:none}
.pill:hover{color:var(--fg)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* 字段控件里的单选胶囊组。刻意用独立的 .opt 类而不是复用导航的 .pill：
   --page-test 用 q('.pill').length 断言导航胶囊数量，复用会让它把选项也算进去。 */
.choices{display:flex;gap:6px;flex-wrap:wrap}
.opt{font-size:12px;padding:4px 12px;border-radius:13px;background:#2e3137;color:var(--dim);
     cursor:pointer;border:1px solid transparent;user-select:none}
.opt:hover{color:var(--fg)}
.opt.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* 「未检测到 Edge 网页应用」引导面板。
   它插在 section 之后（整行宽度），不放进 .f 网格 —— 网格第二列是
   minmax(0,1fr)，塞进去会被挤成一条窄柱。 */
.app-guide{margin:2px 0 16px;padding:12px 14px;background:#1b2735;border-left:2px solid var(--accent);
           border-radius:0 6px 6px 0;font-size:12.5px;color:#b9c6d6;line-height:1.7}
.app-guide .ag-title{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:2px}
.app-guide .ag-sub{color:var(--dim2);font-size:12px}
.app-guide .ag-more{margin-top:10px;padding-top:10px;border-top:1px solid #2b3a4d}
.app-guide .ag-steps{margin:8px 0 10px;padding-left:20px}
.app-guide .ag-steps li{margin-bottom:6px}
.app-guide b{color:var(--fg)}
.app-guide code{font-family:var(--mono);font-size:12px;background:#131c26;border:1px solid #2b3a4d;
                border-radius:4px;padding:2px 7px;color:#cfe3ff;user-select:all}
.app-guide .ag-url{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.app-guide .ag-actions{margin-top:10px}
.app-guide .ag-list{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.app-guide .ag-item{display:grid;grid-template-columns:auto minmax(90px,max-content) minmax(0,1fr);
                    gap:10px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer}
.app-guide .ag-item:hover{background:#22303f}
.app-guide .ag-item input{accent-color:var(--accent)}
.app-guide .ag-name{color:var(--fg)}
.app-guide .ag-id{font-family:var(--mono);font-size:11px;color:var(--dim2);word-break:break-all}
.app-guide .ag-u{font-family:var(--mono);font-size:11px;color:#7d8a99;word-break:break-all}
.app-guide button{font-size:12px;padding:4px 12px;border-radius:5px;border:1px solid #444a52;
                  background:#2e3137;color:#cfd5de;cursor:pointer}
.app-guide button:hover{border-color:#5a6068;color:var(--fg)}
.app-guide button.ag-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{flex:1;overflow-y:auto;padding:14px 18px 8px;scroll-behavior:smooth;position:relative}
footer{flex:none;display:flex;gap:8px;padding:10px 18px;background:var(--panel);
       border-top:1px solid #3a3d42}
footer .grow{margin-left:auto;display:flex;gap:8px}
button{font:13px inherit;padding:6px 15px;border-radius:6px;border:1px solid #444a52;
       background:#2e3137;color:#cfd5de;cursor:pointer}
button:hover:not(:disabled){border-color:#5a6068;color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
section{margin-bottom:18px}
section>h2{margin:0 0 9px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim2);
           display:flex;align-items:center;gap:8px}
section>h2::after{content:"";flex:1;height:1px;background:#2f3237}
.f{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:9px}
.f>label{color:#aeb5c0;font-size:12px}
.f .ctl{min-width:0}
.f .q{width:18px;height:18px;border-radius:50%;background:#2e3137;border:1px solid #454b54;
      color:var(--dim);font-size:11px;font-weight:700;display:flex;align-items:center;
      justify-content:center;cursor:pointer;user-select:none;flex:none}
.f .q:hover{color:var(--fg);border-color:#5a6068}
.f .q.open{background:var(--accent);border-color:var(--accent);color:#fff}
/* 第三列的图标组。选择器写成 .acts .ico 是为了在特异度上盖过上面的
   button:hover:not(:disabled) 等通用按钮规则。 */
.acts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.acts .ico{width:20px;height:20px;padding:0;margin:0;display:flex;align-items:center;
           justify-content:center;background:transparent;border:1px solid transparent;
           border-radius:4px;color:var(--dim2);cursor:pointer;flex:none}
.acts .ico:hover{color:var(--fg);border-color:#454b54;background:#2e3137}
.acts .ico:disabled{opacity:.4;cursor:default;background:transparent;border-color:transparent}
.acts .ico svg{width:14px;height:14px;display:block}
/* 深色滚动条：不写的话 Chromium 用系统浅色滚动条，与整页不搭 */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#1a1b1e}
::-webkit-scrollbar-thumb{background:#3a3e45;border-radius:6px;border:3px solid #1a1b1e}
::-webkit-scrollbar-thumb:hover{background:#4a505a}
::-webkit-scrollbar-corner{background:#1a1b1e}
input[type=text]{width:100%;height:29px;background:#181a1d;border:1px solid var(--line);
  border-radius:5px;color:var(--fg);font:12px var(--mono);padding:0 9px}
input:focus{outline:none;border-color:var(--accent)}
input.bad{border-color:#7a3134}
input[readonly]{background:#232629;color:var(--dim);cursor:default}
.row-msg{grid-column:2/4;font-size:11.5px;margin-top:-6px;min-height:0}
.row-msg.err{color:var(--err)} .row-msg.warn{color:var(--warn)}
.row-msg.check{color:var(--dim2)} .row-msg.good{color:var(--ok)}
.hint{grid-column:2/4;background:#1b2735;border-left:2px solid var(--accent);
      border-radius:0 5px 5px 0;padding:7px 10px;font-size:12px;color:#b9c6d6;line-height:1.65;
      margin-top:-2px}
.hint[hidden]{display:none}
.switch{width:38px;height:21px;border-radius:11px;background:#3a3e45;position:relative;
        cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;
        border-radius:50%;background:#98a1b0;transition:left .15s,background .15s}
.switch.on{background:var(--accent)} .switch.on::after{left:19px;background:#fff}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;white-space:nowrap}
.badge.on{background:#1e3a22;color:var(--ok)} .badge.off{background:#3a1b1b;color:var(--err)}
.badge.error{background:#3a2f18;color:var(--warn)}
.env{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:5px 12px;font-size:12px;
     align-items:center}
.env .k{color:var(--dim2)} .env .v{font:11.5px var(--mono);color:#b9c1cd;word-break:break-all}
.env .acts{align-self:center}
.gnote{font-size:11.5px;color:var(--dim2);margin:-2px 0 8px}
</style>
</head>
<body>
<header><h1>DSH 配置</h1><div id="status">读取中…</div></header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>
  <button id="btnReset">重置</button>
  <button id="btnDefaults">恢复默认</button>
  <span class="grow">
    <button id="btnSave">保存</button>
    <button id="btnSaveRestart" class="primary">保存并重启</button>
  </span>
</footer>
<script src="app.js"></script>
</body>
</html>
